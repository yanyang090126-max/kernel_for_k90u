name: Step 1 - Pure Stock-Compatible Kernel (K90U)

on:
  workflow_dispatch:

jobs:
  build-pure-kernel:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. 清理云端磁盘空间 (为源码和编译产物留足 50GB 空间)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: 2. 安装 Linux 内核编译基础工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            python3 git curl wget zip unzip ccache gawk lz4 zstd

      - name: 3. 拉取你仓库里的原厂配置 (warsaw_stock.config)
        uses: actions/checkout@v4
        with:
          path: repo_files

      - name: 4. 缓存并准备 Google AOSP Clang 编译器 (clang-r510928)
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: k90u-aosp-clang-r510928

      - name: 4.1 下载 Clang (仅在首次无缓存时执行)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang
          wget -qO- https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel-build-2024/clang-r510928.tar.gz | tar -xzf - -C clang

      - name: 5. 缓存并拉取纯净 Google 官方 android15-6.6 源码
        id: cache-kernel-src
        uses: actions/cache@v4
        with:
          path: kernel
          key: k90u-android15-6.6-pure-src-v1

      - name: 5.1 克隆内核源码 (仅在首次无缓存时执行)
        if: steps.cache-kernel-src.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://android.googlesource.com/kernel/common -b android15-6.6 kernel

      - name: 6. 挂载 ccache 编译产物缓存 (实现 2-3 分钟极速增量编译)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: k90u-pure-ccache-${{ github.run_id }}
          restore-keys: |
            k90u-pure-ccache-

      - name: 7. 导入原厂基因图谱并剥离本地私有路径依赖
        run: |
          rm -rf kernel/out
          mkdir -p kernel/out
          cp repo_files/warsaw_stock.config kernel/out/.config

          cd kernel
          export PATH="${GITHUB_WORKSPACE}/clang/bin:${PATH}"

          # 剥离原厂配置中指向本地私钥/证书/白名单的路径
          ./scripts/config --file out/.config \
            --set-str MODULE_SIG_KEY "" \
            --set-str SYSTEM_TRUSTED_KEYS "" \
            --set-str SYSTEM_REVOCATION_KEYS "" \
            -d TRIM_UNUSED_KSYMS \
            -d DEBUG_INFO_BTF \
            -d DEBUG_INFO_BTF_MODULES \
            -d WERROR \
            --set-str LOCALVERSION "-android15-8-g0908354dac1b-ab16143355-4k"

          make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

      - name: 8. 编译纯净内核镜像 (Image)
        working-directory: kernel
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang/bin:${PATH}"
          export CCACHE_DIR="${HOME}/.ccache"
          export CCACHE_COMPILERCHECK=none
          export CCACHE_BASEDIR="${GITHUB_WORKSPACE}"
          export CCACHE_SLOPPINESS="file_macro,locale,time_macros"
          ccache -M 3.5G
          ccache -z

          touch .scmversion
          set -o pipefail
          if ! make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="ccache clang" CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" \
            Image 2>&1 | tee build.log; then
            echo "================ 真正报错原因汇总 ================"
            grep -iE "error:|No rule to make target|fatal:" build.log | tail -n 30
            exit 1
          fi

          ccache -s

      - name: 9. 打包为纯 64 位 GKI AnyKernel3 刷机包 (精确锁定 K90U boot 分区)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git

          # 1. 替换为纯 64 位 (aarch64) 静态编译的 busybox
          wget -qO AnyKernel3/tools/busybox "https://github.com/EXALAB/Busybox-static/raw/main/busybox_arm64" || \
          wget -qO AnyKernel3/tools/busybox "https://github.com/Magisk-Modules-Repo/busybox-ndk/raw/master/busybox-arm64"
          chmod 755 AnyKernel3/tools/busybox
          file AnyKernel3/tools/busybox

          # 2. 放入编译好的纯净内核镜像
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/

          # 3. 针对 GKI 2.0 纯内核 boot 分区重写 anykernel.sh (严格保持 YAML 10 空格缩进)
          cat << 'EOF' > AnyKernel3/anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          properties() { '
          kernel.string=K90U-Pure-6.6.118-android15-8
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=warsaw
          supported.versions=
          supported.patchlevels=
          '; }

          BLOCK=/dev/block/by-name/boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          # GKI 2.0 专用刷入流程：只拆分内核头与替换 Image，跳过 ramdisk 解包
          split_boot;
          flash_boot;
          EOF

          # 去掉写入后每行前面的 10 个前导空格，保持脚本整洁
          sed -i 's/^          //' AnyKernel3/anykernel.sh

          cd AnyKernel3
          zip -r9 ../Step1-Pure-K90U-6.6-AK3.zip * -x .git README.md *placeholder

      - name: 10. 上传第 1 课成品包
        uses: actions/upload-artifact@v4
        with:
          name: Step1-Pure-K90U-6.6-AK3
          path: Step1-Pure-K90U-6.6-AK3.zip
